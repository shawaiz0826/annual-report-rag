# All tunables live here. Environment variables override (nested keys with `__`,
# e.g. RETRIEVAL__TOP_K=5); CLI flags override environment. Secrets and model
# identifiers come from `.env` (see .env.example).

paths:
  raw_dir: data/raw
  derived_dir: data/derived
  index_dir: data/index
  traces_dir: data/index/traces
  replay_cache: data/index/replay.json

ingestion:
  profile_pages: 3              # first N pages sent to the profiler
  profile_sample_middle: true   # also send one mid-document page
  profile_max_chars_per_page: 6000
  dedupe_lines: true
  header_footer_min_page_ratio: 0.5   # a line repeating on >= this share of pages is a running header/footer
  header_footer_long_line_ratio: 0.15 # ...or a long line (>= chars below) repeating on this share
  header_footer_long_line_chars: 25
  header_footer_zone_lines: 3         # only the first/last N lines of a page can be headers/footers
  min_chunk_chars: 200
  min_pages_for_header_detection: 4

chunking:
  strategy: fixed_window
  chunk_chars: 800
  overlap_chars: 100
  respect_page_boundary: true
  table_chunks: true            # emit extracted tables as separate chunks
  min_table_rows: 2

embeddings:
  provider: sentence_transformers
  model: BAAI/bge-small-en-v1.5
  batch_size: 64
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "

vector_store:
  provider: chroma
  collection: chunks

lexical:
  provider: bm25
  k1: 1.5
  b: 0.75

retrieval:
  top_k: 8
  candidates_per_index: 30
  rrf_k: 60
  per_issuer_round_robin: true
  page_expansion: true
  page_expansion_max_chars: 4000
  page_expansion_min_numeric_tokens: 8

facts:
  pages_per_document: 6         # statement pages selected via retrieval per metric hints
  max_table_pages: 4            # extra pages whose extracted tables mention a registry metric
  extraction_concurrency: 4     # parallel LLM calls per document during extraction
  agreement_tolerance_pct: 1.0
  min_confidence_to_use: 0.5

agent:
  max_steps: 6
  temperature: 0.0
  max_history_turns: 4
  history_answer_chars: 300
  show_model_knowledge: false
  tool_result_max_chars: 6000
  max_output_tokens: 4096

llm:
  timeout_s: 90
  max_retries: 3
  backoff_base_s: 1.5
  exclude_reasoning: true       # reasoning models: drop thinking tokens from the returned content
  usage_accounting: openrouter  # openrouter | price_table
  price_table:                  # USD per 1M tokens, fallback only; verified on openrouter.ai 2026-10-10
    nvidia/nemotron-3-ultra-550b-a55b:free: {input: 0.0, output: 0.0}
    google/gemma-4-31b-it:free: {input: 0.0, output: 0.0}
    anthropic/claude-sonnet-5: {input: 2.0, output: 10.0}
    google/gemini-3.1-pro-preview: {input: 2.0, output: 12.0}
  known_models:                 # offered by the UI model selector and `/model`
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - google/gemma-4-31b-it:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - anthropic/claude-sonnet-5
    - google/gemini-3.1-pro-preview

sessions:
  backend: sqlite
  path: data/index/sessions.db

api:
  host: 0.0.0.0
  port: 8000
